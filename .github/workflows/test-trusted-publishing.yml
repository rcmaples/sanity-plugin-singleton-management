name: Test Trusted Publishing

on:
  workflow_dispatch: # Allows manual triggering from GitHub Actions UI

jobs:
  test-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # Required for NPM trusted publishing via OIDC

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Build package
        run: npm run build

      - name: Verify OIDC Setup
        run: |
          echo "🔍 Checking OIDC configuration..."
          echo ""
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "✅ OIDC token request URL is available"
            echo "✅ id-token: write permission is configured correctly"
            echo "✅ GitHub Actions can request OIDC tokens"
            echo ""
            echo "OIDC URL: $ACTIONS_ID_TOKEN_REQUEST_URL"
          else
            echo "❌ OIDC token not available - check workflow permissions"
            exit 1
          fi

      - name: Semantic Release (Dry Run)
        run: npx semantic-release --dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Test Summary
        if: always()
        run: |
          echo ""
          echo "=========================================="
          echo "Test Summary"
          echo "=========================================="
          echo ""
          echo "This dry-run test verified:"
          echo "  ✓ OIDC token generation works"
          echo "  ✓ Build process succeeds"
          echo "  ✓ Tests pass"
          echo "  ✓ Semantic-release configuration is valid"
          echo ""
          echo "Next steps:"
          echo "  1. Configure trusted publisher on npmjs.com"
          echo "  2. Monitor the next real release"
          echo "  3. Verify provenance on published package"
          echo ""
